[package]
name = "epomaker-cli"
description = "Command line tool to configure EPOMAKER keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "epomaker"
path = "src/main.rs"

[dependencies]
epomaker-core = { workspace = true }
epomaker-host = { workspace = true }
ctrlc = "3.5"
clap_complete = "4.5"
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
