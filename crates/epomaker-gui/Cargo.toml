[package]
name = "epomaker-gui"
description = "Open control panel for EPOMAKER keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "epomaker-panel"
path = "src/main.rs"

[dependencies]
epomaker-core = { workspace = true }
epomaker-host = { workspace = true }
eframe = { workspace = true, features = ["persistence"] }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { version = "0.18", optional = true }
egui-phosphor = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Development aid: `EPOMAKER_AUTOSHOT=<dir>` renders every tab of the demo keyboard to PNG files.
autoshot = ["dep:png"]

# ---- Linux packages (cargo deb -p epomaker-gui / cargo generate-rpm -p crates/epomaker-gui) ----
# Run packaging/linux/completions.sh after the release build to create target/completions.

[package.metadata.deb]
name = "open-epomaker-panel"
maintainer = "blzkz <sergiobl88@gmail.com>"
copyright = "2026, blzkz"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
Open-source control panel for EPOMAKER keyboards (TH80 family): lighting effects, \
per-key RGB, key remapping, macros, profiles and settings. Includes the GUI \
(epomaker-panel), the command line tool (epomaker), a tray agent for \
per-application profiles and music/screen effects (epomaker-agent) and a udev rule that lets \
desktop users access the keyboard without root."""
maintainer-scripts = "../../packaging/linux/debian"
assets = [
    ["target/release/epomaker-panel", "usr/bin/", "755"],
    ["target/release/epomaker", "usr/bin/", "755"],
    ["target/release/epomaker-agent", "usr/bin/", "755"],
    ["../../packaging/linux/70-epomaker.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../packaging/linux/open-epomaker-panel.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/open-epomaker-agent.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/open-epomaker-panel.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/icons/open-epomaker-panel.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../README.md", "usr/share/doc/open-epomaker-panel/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/open-epomaker-panel/FONTS-OFL.txt", "644"],
    ["../../target/completions/epomaker.bash", "usr/share/bash-completion/completions/epomaker", "644"],
    ["../../target/completions/_epomaker", "usr/share/zsh/vendor-completions/", "644"],
    ["../../target/completions/epomaker.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.generate-rpm]
name = "open-epomaker-panel"
summary = "Open control panel for EPOMAKER keyboards"
license = "MIT"
url = "https://github.com/blzkz/open-epomaker-panel-control"
post_install_script = "udevadm control --reload-rules >/dev/null 2>&1 || :\nudevadm trigger --subsystem-match=hidraw >/dev/null 2>&1 || :"
assets = [
    { source = "target/release/epomaker-panel", dest = "/usr/bin/epomaker-panel", mode = "755" },
    { source = "target/release/epomaker", dest = "/usr/bin/epomaker", mode = "755" },
    { source = "target/release/epomaker-agent", dest = "/usr/bin/epomaker-agent", mode = "755" },
    { source = "../../packaging/linux/70-epomaker.rules", dest = "/usr/lib/udev/rules.d/70-epomaker.rules", mode = "644" },
    { source = "../../packaging/linux/open-epomaker-panel.desktop", dest = "/usr/share/applications/open-epomaker-panel.desktop", mode = "644" },
    { source = "../../packaging/linux/open-epomaker-agent.desktop", dest = "/usr/share/applications/open-epomaker-agent.desktop", mode = "644" },
    { source = "../../packaging/icons/open-epomaker-panel.svg", dest = "/usr/share/icons/hicolor/scalable/apps/open-epomaker-panel.svg", mode = "644" },
    { source = "../../packaging/icons/open-epomaker-panel.png", dest = "/usr/share/icons/hicolor/256x256/apps/open-epomaker-panel.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/open-epomaker-panel/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/open-epomaker-panel/LICENSE", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/open-epomaker-panel/FONTS-OFL.txt", mode = "644", doc = true },
    { source = "../../target/completions/epomaker.bash", dest = "/usr/share/bash-completion/completions/epomaker", mode = "644" },
    { source = "../../target/completions/_epomaker", dest = "/usr/share/zsh/site-functions/_epomaker", mode = "644" },
    { source = "../../target/completions/epomaker.fish", dest = "/usr/share/fish/vendor_completions.d/epomaker.fish", mode = "644" },
]
