name: Release

# Push a tag like `v0.1.0` to build every package and publish a GitHub release.
# Running it by hand (workflow_dispatch) only builds the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  linux:
    # oldest supported Ubuntu runner: the binaries then work on any distro with glibc >= 2.35
    runs-on: ubuntu-22.04
    needs: version
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p epomaker-core
      - run: cargo build --release -p epomaker-cli -p epomaker-gui -p epomaker-agent
      - name: Tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          packaging/linux/completions.sh
          cargo deb -p epomaker-gui --no-build -o dist/
          cargo generate-rpm -p crates/epomaker-gui -o dist/
          packaging/linux/build-appimage.sh dist
          name=open-epomaker-panel-linux-x86_64
          mkdir -p "$name/icons"
          cp target/release/epomaker target/release/epomaker-panel target/release/epomaker-agent README.md README.es.md LICENSE "$name/"
          cp crates/epomaker-gui/assets/fonts/OFL.txt "$name/FONTS-OFL.txt"
          cp -r packaging/linux "$name/linux"
          cp packaging/icons/open-epomaker-panel.svg packaging/icons/open-epomaker-panel.png "$name/icons/"
          tar -czf "dist/$name.tar.gz" "$name"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  arch:
    runs-on: ubuntu-latest
    needs: version
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git rust systemd-libs libxkbcommon libglvnd hicolor-icon-theme
      - uses: actions/checkout@v7
      - name: makepkg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir /build && cp packaging/arch/PKGBUILD /build/
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /build/PKGBUILD
          # use this checkout instead of downloading the tag archive
          git archive --prefix="open-epomaker-panel-control-$VERSION/" -o "/build/open-epomaker-panel-$VERSION.tar.gz" HEAD
          useradd -m builder && chown -R builder /build
          cd /build && sudo -u builder makepkg --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp /build/*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p epomaker-core
      - run: cargo build --release -p epomaker-cli -p epomaker-gui -p epomaker-agent
      - name: Package
        shell: pwsh
        run: |
          $name = "open-epomaker-panel-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
          Copy-Item target/release/epomaker-panel.exe, target/release/epomaker.exe, target/release/epomaker-agent.exe, README.md, README.es.md, LICENSE $name
          Copy-Item crates/epomaker-gui/assets/fonts/OFL.txt "$name/FONTS-OFL.txt"
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, linux, arch, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          sed "s/{{VERSION}}/$VERSION/g" packaging/release-notes.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
          # only versions with a suffix (0.5.0-rc1) are pre-releases
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
