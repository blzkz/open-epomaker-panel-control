[workspace]
resolver = "2"
members = ["crates/epomaker-core", "crates/epomaker-host", "crates/epomaker-cli", "crates/epomaker-gui", "crates/epomaker-agent"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/blzkz/open-epomaker-panel-control"
rust-version = "1.89"

[workspace.dependencies]
epomaker-core = { path = "crates/epomaker-core" }
epomaker-host = { path = "crates/epomaker-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
eframe = "0.36"

# Keep target/ small while developing (see tools/trim-target.sh): line tables are enough for
# backtraces in our crates, and dependencies get no debug info at all. Release builds are
# not affected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
