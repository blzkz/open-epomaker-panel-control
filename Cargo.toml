[workspace]
resolver = "2"
members = ["crates/epomaker-core", "crates/epomaker-cli", "crates/epomaker-gui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/blzkz/open-epomaker-panel-control"
rust-version = "1.88"

[workspace.dependencies]
epomaker-core = { path = "crates/epomaker-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
eframe = "0.36"
